<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#174668" />
      <stop offset="100%" stop-color="#0e2f47" />
    </linearGradient>
    <linearGradient id="petalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>
    <linearGradient id="centerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>
  
  <!-- Background Card -->
  <rect width="100" height="100" rx="28" fill="url(#bgGrad)" />
  
  <!-- Subtle Teal Border -->
  <rect x="2.5" y="2.5" width="95" height="95" rx="25.5" fill="none" stroke="#2dd4bf" stroke-width="3" stroke-opacity="0.4" />
  
  <!-- Bunga Sekar (5 Petals with Center) -->
  <g transform="translate(50, 50)" filter="url(#shadow)">
    <!-- Petals -->
    <ellipse cx="0" cy="-21" rx="10.5" ry="17" fill="url(#petalGrad)" transform="rotate(0)" />
    <ellipse cx="0" cy="-21" rx="10.5" ry="17" fill="url(#petalGrad)" transform="rotate(72)" />
    <ellipse cx="0" cy="-21" rx="10.5" ry="17" fill="url(#petalGrad)" transform="rotate(144)" />
    <ellipse cx="0" cy="-21" rx="10.5" ry="17" fill="url(#petalGrad)" transform="rotate(216)" />
    <ellipse cx="0" cy="-21" rx="10.5" ry="17" fill="url(#petalGrad)" transform="rotate(288)" />
    
    <!-- Flower Center Core -->
    <circle cx="0" cy="0" r="11" fill="url(#centerGrad)" stroke="#ffffff" stroke-width="2.5" />
    <circle cx="-3" cy="-3" r="3" fill="#ffffff" opacity="0.8" />
  </g>
</svg>
